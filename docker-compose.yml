version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sauraroute-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sauraroute_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sauraroute_dev_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
